<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Михаил Агеев — открыть в приложении</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #22618D 0%, #347FB3 34%, #165079 68%, #165079 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 340px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
  p { font-size: 15px; line-height: 1.45; opacity: .85; margin-bottom: 28px; }
  a.btn {
    display: block;
    background: #fff;
    color: #165079;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    border-radius: 30px;
    padding: 15px 24px;
    margin-bottom: 14px;
  }
  a.link { color: #fff; opacity: .8; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Михаил Агеев</h1>
  <p>Этим контентом поделились из приложения. Откройте его в приложении, чтобы посмотреть.</p>
  <a class="btn" id="open" href="#">Открыть в приложении</a>
  <a class="link" href="https://mikhail-ageev.ru">Перейти на сайт</a>
</div>
<script>
  // /l/<type>/<id> → ageev://<type>/<id>
  var m = location.pathname.match(/^\/l\/(affirmation|meditation|webinar|breakfast)\/([^\/?#]+)/);
  var target = m ? 'ageev://' + m[1] + '/' + m[2] : null;
  var btn = document.getElementById('open');
  if (target) {
    btn.href = target;
    // Автопереход в приложение; если его нет, страница просто остаётся.
    setTimeout(function () { location.href = target; }, 60);
  } else {
    btn.href = 'https://mikhail-ageev.ru';
  }
</script>
</body>
</html>
